# PBC Visitor Kiosk — frontend nginx config.
# Serves the built SPA and reverse-proxies backend paths so the browser only
# ever talks to one origin (no CORS needed in normal operation).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Visitor photos are capped at 5 MB by the backend; allow headroom so the
    # proxy never rejects a valid upload before the backend can validate it.
    client_max_body_size 8m;

    # Do not advertise the nginx version.
    server_tokens off;

    # Re-resolve the backend via Docker's embedded DNS so a backend restart that
    # changes the container IP does not leave nginx pinned to a stale address.
    # Using a variable in proxy_pass forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";

    # Lightweight health endpoint for container / orchestrator probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Backend-proxied paths -------------------------------------------------
    # The backend service name resolves on the shared Docker network.
    location /api/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static files the backend serves (visitor photos, generated badges, logos).
    location /uploads/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # Backend health endpoints (proxied for convenience / diagnostics).
    location /health {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Static SPA ------------------------------------------------------------
    # Everything else (including /themes/*.png shipped in the bundle) is served
    # from the static build, with a client-side-routing fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
