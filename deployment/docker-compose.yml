# PBC Visitor Kiosk — container deployment (Option A: direct IP:PORT access).
#
# Usage (from this directory):
#   cp .env.example .env      # then edit secrets/values
#   docker compose up -d --build
#
# The frontend is published on the host; the backend stays on the internal
# network only. The print agent is intentionally NOT part of this stack.

name: pbc-guest-kiosk

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: pbc-guest-kiosk-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Backend runtime configuration (JWT, admin bootstrap, CORS, limits).
    env_file: .env
    # Internal only — reachable from the frontend container, not published.
    expose:
      - "8000"
    volumes:
      - kiosk_db:/data
      - kiosk_uploads:/app/uploads
      - kiosk_logs:/app/logs
      - kiosk_config:/app/config
    networks:
      - kiosk-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin; nginx proxies /api, /uploads, /health to backend.
        VITE_API_BASE: "${VITE_API_BASE:-}"
    image: pbc-guest-kiosk-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - kiosk-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  kiosk-net:
    driver: bridge

volumes:
  kiosk_db:
  kiosk_uploads:
  kiosk_logs:
  kiosk_config:
